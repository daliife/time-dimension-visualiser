<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pixel time visualiser</title>
  </head>
  <body>
    <div id="view"></div>
    <div id="status" role="status" aria-live="polite">
      <div class="loader">
        <span class="spinner" aria-hidden="true"></span>
        <p class="loader-title" id="status-title">Loading clip</p>
        <p class="loader-detail" id="status-detail">Reading the video…</p>
      </div>
    </div>
    <aside id="panel" hidden>
      <div class="transport">
        <button type="button" id="play" aria-pressed="false" aria-label="Play">
          <svg class="icon" id="icon-play" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M5 3.2v9.6l8.2-4.8L5 3.2z" fill="currentColor" />
          </svg>
          <svg class="icon" id="icon-pause" viewBox="0 0 16 16" aria-hidden="true" hidden>
            <path d="M4.4 3h2.3v10H4.4V3zm4.9 0h2.3v10H9.3V3z" fill="currentColor" />
          </svg>
          <span id="play-label">Play</span>
        </button>
        <button
          type="button"
          id="reset-view"
          aria-label="Reset camera to the default view"
          title="Reset camera to the default view"
        >
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="8" cy="8" r="5.1" fill="none" stroke="currentColor" stroke-width="1.35" />
            <circle cx="8" cy="8" r="1.15" fill="currentColor" />
            <path
              d="M8 2.35v2.1M8 11.55v2.1M2.35 8h2.1M11.55 8h2.1"
              fill="none"
              stroke="currentColor"
              stroke-width="1.35"
              stroke-linecap="round"
            />
          </svg>
          <span>Reset view</span>
        </button>
      </div>
      <label>
        <span class="label-row">
          <span class="label-title">
            <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
              <circle cx="8" cy="8" r="5.25" fill="none" stroke="currentColor" stroke-width="1.4" />
              <path d="M8 5v3.2l2.1 1.3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
            </svg>
            Time
          </span>
          <span id="time-value">0</span>
        </span>
        <input id="time" type="range" min="0" max="39" value="0" aria-describedby="time-hint" />
        <span class="hint" id="time-hint">Brightens this frame. The others stay in the stack.</span>
      </label>
      <label>
        <span class="label-row">
          <span class="label-title">
            <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
              <path d="M2.5 4.5h11M3.5 8h9M4.5 11.5h7" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
            </svg>
            Gap
          </span>
        </span>
        <input id="gap" type="range" min="0" max="100" value="28" aria-describedby="gap-hint" />
        <span class="hint" id="gap-hint">Stretches the cube along time so pixel trails read more clearly.</span>
      </label>
    </aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
